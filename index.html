<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow | Student Management Portal</title>
    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MOCK DATABASE & AUTH SERVICE ---
        const DB = {
            init: () => {
                if (!localStorage.getItem('portal_db')) {
                    const initialData = {
                        users: [
                            { id: 1, name: 'Alex Rivera', email: 'student@example.com', password: 'password123', role: 'student', attendance: 92, bio: 'Computer Science Major' }
                        ],
                        courses: [
                            { id: 1, name: 'Advanced Web Development', progress: 75, instructor: 'Dr. Smith', code: 'CS302' },
                            { id: 2, name: 'UI/UX Principles', progress: 40, instructor: 'Prof. Jane', code: 'DS101' },
                            { id: 3, name: 'Database Systems', progress: 90, instructor: 'Dr. Lee', code: 'CS205' }
                        ],
                        assignments: [
                            { id: 1, title: 'React State Management', deadline: '2026-05-15', status: 'Pending' },
                            { id: 2, title: 'Database Schema Design', deadline: '2026-05-10', status: 'Submitted' }
                        ]
                    };
                    localStorage.setItem('portal_db', JSON.stringify(initialData));
                }
            },
            getData: () => JSON.parse(localStorage.getItem('portal_db'))
        };

        // --- COMPONENTS ---

        const SidebarItem = ({ icon, label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`flex items-center space-x-3 w-full p-3 rounded-xl transition-all duration-200 ${
                    active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'text-slate-500 hover:bg-indigo-50 hover:text-indigo-600'
                }`}
            >
                <i className={`fas ${icon} w-5`}></i>
                <span className="font-medium">{label}</span>
            </button>
        );

        const Card = ({ children, title, subtitle }) => (
            <div className="bg-white p-6 rounded-2xl custom-shadow border border-slate-100">
                {title && <h3 className="text-lg font-bold text-slate-800 mb-1">{title}</h3>}
                {subtitle && <p className="text-slate-500 text-sm mb-4">{subtitle}</p>}
                {children}
            </div>
        );

        // --- PAGES ---

        const Login = ({ onLogin }) => {
            const [email, setEmail] = useState('student@example.com');
            const [pass, setPass] = useState('password123');
            const [loading, setLoading] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    const data = DB.getData();
                    const user = data.users.find(u => u.email === email && u.password === pass);
                    if (user) onLogin(user);
                    else alert("Invalid credentials. Try student@example.com / password123");
                    setLoading(false);
                }, 800);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-indigo-50 p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl text-2xl mb-4 shadow-xl shadow-indigo-200">
                                <i className="fas fa-graduation-cap"></i>
                            </div>
                            <h2 className="text-3xl font-bold text-slate-900">Welcome Back</h2>
                            <p className="text-slate-500 mt-2">Access your student dashboard</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" required />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                                <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" required />
                            </div>
                            <button className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all transform active:scale-95">
                                {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user }) => {
            const data = DB.getData();
            return (
                <div className="space-y-8 animate-in fade-in duration-500">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <Card title="Attendance" subtitle="Overall performance">
                            <div className="flex items-end justify-between">
                                <span className="text-4xl font-bold text-indigo-600">{user.attendance}%</span>
                                <span className="text-emerald-500 text-sm font-medium"><i className="fas fa-arrow-up"></i> 2% from last month</span>
                            </div>
                            <div className="w-full bg-slate-100 h-2 mt-4 rounded-full overflow-hidden">
                                <div className="bg-indigo-600 h-full rounded-full" style={{width: `${user.attendance}%`}}></div>
                            </div>
                        </Card>
                        <Card title="Courses" subtitle="Active enrollments">
                            <span className="text-4xl font-bold text-slate-800">{data.courses.length}</span>
                            <p className="text-slate-500 text-sm mt-2">2 exams upcoming</p>
                        </Card>
                        <Card title="Assignments" subtitle="Next 7 days">
                            <span className="text-4xl font-bold text-orange-500">{data.assignments.filter(a => a.status === 'Pending').length}</span>
                            <p className="text-slate-500 text-sm mt-2">Due by Friday</p>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <Card title="Course Progress">
                            <div className="space-y-6 mt-4">
                                {data.courses.map(c => (
                                    <div key={c.id}>
                                        <div className="flex justify-between text-sm font-medium mb-2">
                                            <span className="text-slate-700">{c.name}</span>
                                            <span className="text-indigo-600">{c.progress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                            <div className="bg-indigo-500 h-full transition-all duration-1000" style={{width: `${c.progress}%`}}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                        <Card title="Recent Notifications">
                            <div className="space-y-4 mt-2">
                                {[1, 2].map(n => (
                                    <div key={n} className="flex space-x-4 p-3 hover:bg-slate-50 rounded-xl transition cursor-pointer">
                                        <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center flex-shrink-0">
                                            <i className="fas fa-bell text-sm"></i>
                                        </div>
                                        <div>
                                            <h4 className="text-sm font-semibold">New Assignment Posted</h4>
                                            <p className="text-xs text-slate-500">Your instructor posted 'Final Project' in Web Dev.</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                DB.init();
                const saved = localStorage.getItem('portal_user');
                if (saved) setUser(JSON.parse(saved));
            }, []);

            const handleLogin = (userData) => {
                setUser(userData);
                localStorage.setItem('portal_user', JSON.stringify(userData));
            };

            const logout = () => {
                localStorage.removeItem('portal_user');
                setUser(null);
            };

            if (!user) return <Login onLogin={handleLogin} />;

            return (
                <div className={`flex min-h-screen ${isDarkMode ? 'bg-slate-900 text-white' : 'bg-slate-50'}`}>
                    {/* Sidebar */}
                    <aside className="w-72 bg-white border-r border-slate-100 p-6 hidden lg:flex flex-col sidebar-transition">
                        <div className="flex items-center space-x-3 mb-10 px-2">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white">
                                <i className="fas fa-bolt"></i>
                            </div>
                            <span className="text-xl font-black tracking-tight text-slate-800">EduFlow</span>
                        </div>

                        <nav className="flex-1 space-y-2">
                            <SidebarItem icon="fa-chart-pie" label="Dashboard" active={view === 'dashboard'} onClick={() => setView('dashboard')} />
                            <SidebarItem icon="fa-book-open" label="My Courses" active={view === 'courses'} onClick={() => setView('courses')} />
                            <SidebarItem icon="fa-tasks" label="Assignments" active={view === 'assignments'} onClick={() => setView('assignments')} />
                            <SidebarItem icon="fa-user-circle" label="Profile" active={view === 'profile'} onClick={() => setView('profile')} />
                        </nav>

                        <div className="pt-6 border-t border-slate-100">
                            <button onClick={logout} className="flex items-center space-x-3 w-full p-3 text-red-500 hover:bg-red-50 rounded-xl transition">
                                <i className="fas fa-sign-out-alt"></i>
                                <span className="font-medium">Logout</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Area */}
                    <main className="flex-1 p-6 md:p-10 lg:p-12 overflow-y-auto">
                        <header className="flex justify-between items-center mb-10">
                            <div>
                                <h1 className="text-3xl font-extrabold text-slate-900 capitalize">{view}</h1>
                                <p className="text-slate-500">Welcome back, {user.name}!</p>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-slate-400 hover:text-indigo-600 transition">
                                    <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                                <div className="hidden md:block text-right">
                                    <p className="text-sm font-bold text-slate-800">{user.name}</p>
                                    <p className="text-xs text-slate-500">{user.role}</p>
                                </div>
                                <img src={`https://ui-avatars.com/api/?name=${user.name}&background=6366f1&color=fff`} className="w-12 h-12 rounded-2xl border-2 border-white shadow-md" alt="profile" />
                            </div>
                        </header>

                        {view === 'dashboard' && <Dashboard user={user} />}
                        {view === 'courses' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-in slide-in-from-bottom-4 duration-500">
                                {DB.getData().courses.map(c => (
                                    <Card key={c.id} title={c.name} subtitle={c.code}>
                                        <div className="mt-4 p-4 bg-slate-50 rounded-xl">
                                            <div className="flex items-center text-sm text-slate-600 mb-2">
                                                <i className="fas fa-user-tie mr-2"></i> {c.instructor}
                                            </div>
                                            <div className="flex justify-between text-xs font-bold text-indigo-600 mb-1">
                                                <span>Progress</span>
                                                <span>{c.progress}%</span>
                                            </div>
                                            <div className="w-full bg-white h-1.5 rounded-full overflow-hidden border border-slate-100">
                                                <div className="bg-indigo-500 h-full" style={{width: `${c.progress}%`}}></div>
                                            </div>
                                        </div>
                                    </Card>
                                ))}
                            </div>
                        )}
                        {view !== 'dashboard' && view !== 'courses' && (
                            <div className="h-64 flex flex-col items-center justify-center text-slate-400">
                                <i className="fas fa-tools text-4xl mb-4"></i>
                                <p>The {view} section is under development in this demo.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
